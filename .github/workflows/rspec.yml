name: RSpec

on:
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Wait for 60 seconds (for merge queue testing)
        run: sleep 60

      - name: Run RSpec
        run: bundle exec rspec
